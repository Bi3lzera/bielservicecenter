# Configuração Nginx para IP Interno: 10.7.26.236
# Sistema interno sem SSL/HTTPS

server {
    listen 80;
    server_name 10.7.26.208;
    root /home/biel/biel/helpdesk/helpdesk_sistema/api/public;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";

    index index.php index.html;

    charset utf-8;

    # Laravel API routes
    location /api/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /broadcasting/auth {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /sanctum/csrf-cookie {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Frontend assets (CSS, JS, etc.)
    location /assets/ {
        alias /home/biel/biel/helpdesk/helpdesk_sistema/app/dist/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Frontend static files
    location / {
        root /home/biel/biel/helpdesk/helpdesk_sistema/app/dist;
        try_files $uri $uri/ /index.html;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    # PHP processing
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    # Deny access to hidden files
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # WebSocket proxy para Reverb (porta 8080)
    location /app {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # Cache para assets estáticos (images, fonts, etc - NOT css/js handled by /assets/)
    location ~* \.(jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
